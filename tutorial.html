<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koraput NILP - Automated Tutorial</title>
    <script src="tailwind.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; overflow: hidden; }
        
        /* Forces exactly 16:9 ratio for screen recording */
        #video-container {
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            max-height: 100vh;
            max-width: 177.78vh;
            margin: auto;
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }

        .fade-in { animation: fadeIn 0.5s ease-in forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="video-container" class="flex shadow-2xl">
        <!-- LEFT PANE: Presentation Text -->
        <div class="w-5/12 h-full flex flex-col justify-center p-16 pl-20 relative z-10 border-r border-slate-800 bg-slate-900/50">
            <div class="w-16 h-16 bg-orange-500 rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-orange-500/30">
                <i class="fa-solid fa-graduation-cap text-3xl text-white"></i>
            </div>
            <h3 id="tut-step" class="text-orange-400 font-bold tracking-widest uppercase text-sm mb-3">Welcome</h3>
            <h1 id="tut-title" class="text-5xl font-black text-white leading-tight mb-6 transition-all duration-300">Koraput ULLAS Initiative</h1>
            <p id="tut-desc" class="text-xl text-slate-400 font-medium leading-relaxed transition-all duration-300">Automated Platform Demonstration.</p>
            
            <button id="start-btn" onclick="startTutorial()" class="mt-12 px-8 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-full w-max shadow-[0_0_20px_rgba(79,70,229,0.4)] transition-all">
                <i class="fa-solid fa-play mr-2"></i> Start Automation
            </button>
        </div>

        <!-- RIGHT PANE: Mobile Simulator -->
        <div class="w-7/12 h-full flex items-center justify-center relative overflow-hidden">
            <!-- Decorative background elements -->
            <div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-3xl"></div>
            <div class="absolute bottom-[-10%] left-[10%] w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-3xl"></div>

            <!-- Mobile Phone Hardware Frame -->
            <div class="relative w-[400px] h-[820px] bg-slate-800 rounded-[3.5rem] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.7)] border-[12px] border-slate-800 overflow-hidden ring-1 ring-slate-700 z-20">
                <!-- Phone Camera Notch -->
                <div class="absolute top-0 inset-x-0 h-7 w-40 bg-slate-800 rounded-b-3xl mx-auto z-50 flex items-center justify-center gap-4">
                    <div class="w-16 h-1.5 bg-slate-700 rounded-full"></div>
                    <div class="w-3 h-3 bg-slate-900 rounded-full border border-slate-700/50"></div>
                </div>

                <!-- THE ACTUAL WEBSITE LOADED HERE -->
                <iframe id="app-frame" src="index.html" class="w-full h-full border-none bg-white rounded-[2.5rem]"></iframe>
            </div>
        </div>
    </div>

    <script>
        const frame = document.getElementById('app-frame');
        
        // Automation Helper Functions
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        
        const updateText = async (step, title, desc) => {
            const elStep = document.getElementById('tut-step');
            const elTitle = document.getElementById('tut-title');
            const elDesc = document.getElementById('tut-desc');
            
            elTitle.style.opacity = 0; elDesc.style.opacity = 0;
            await wait(300);
            
            elStep.innerText = step;
            elTitle.innerText = title;
            elDesc.innerText = desc;
            
            elTitle.style.opacity = 1; elDesc.style.opacity = 1;
        };

        const simulateTyping = async (inputId, text, speed = 100) => {
            const doc = frame.contentWindow.document;
            const input = doc.getElementById(inputId);
            input.focus();
            input.value = '';
            for (let i = 0; i < text.length; i++) {
                input.value += text[i];
                // Dispatch input event so your site's JS detects the changes
                input.dispatchEvent(new Event('input', { bubbles: true }));
                await wait(speed);
            }
            input.blur();
        };

        const clickElement = async (id) => {
            const doc = frame.contentWindow.document;
            const el = doc.getElementById(id);
            if(el) {
                el.style.transform = "scale(0.95)"; // Visual click effect
                await wait(150);
                el.style.transform = "scale(1)";
                el.click();
            }
        };

        const smoothScrollTo = async (id) => {
            const doc = frame.contentWindow.document;
            const el = doc.getElementById(id);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            await wait(800);
        };

        // THE MASTER AUTOMATION SCRIPT
        async function startTutorial() {
            document.getElementById('start-btn').classList.add('hidden');
            const doc = frame.contentWindow.document;

            // Phase 1: Intro
            await updateText("Phase 1", "Zero-Cost District Portal", "Designed specifically for Koraput's rural connectivity. Lightning fast and highly secure.");
            await wait(3000);

            // Phase 2: Registration Click
            await updateText("Step 1", "Teacher Registration", "Teachers simply click the registration tile to begin enrolling illiterate adults.");
            await smoothScrollTo('btn-show-form');
            await clickElement('btn-show-form');
            await wait(2000);

            // Phase 3: Personal Details
            await updateText("Step 2", "Secure Identification", "Every teacher uses their own mobile number and sets a secure 4-digit PIN.");
            await smoothScrollTo('teacher-name');
            await simulateTyping('teacher-name', 'Rajesh Kumar');
            await wait(500);
            await simulateTyping('teacher-phone', '9876543210');
            await wait(500);
            await simulateTyping('teacher-pin', '1234');
            await simulateTyping('teacher-pin-confirm', '1234');
            await wait(1500);

            // Phase 4: The Magic UDISE
            await updateText("Step 3", "The Magic UDISE System", "100% Anti-Fraud. Watch what happens when the 11th digit is entered...");
            await smoothScrollTo('school-udise');
            await simulateTyping('school-udise', '21290100104', 300); // Typing slowly for drama
            await wait(2000);

            await updateText("Verified", "Instant Database Sync", "The system instantly pulls the official School Name, Block, and Cluster from the server. Fake entries are mathematically impossible.");
            await wait(4000);

            // Phase 5: Submission
            await updateText("Step 4", "Score Submission", "The teacher inputs the number of adults they have successfully enrolled.");
            await simulateTyping('learners-enrolled', '55');
            await wait(1000);
            await clickElement('submit-btn');
            await wait(3000);

            // Phase 6: Success
            await updateText("Step 5", "Instant Gratification", "The system confirms the submission and instantly updates the live district maps and leaderboards.");
            await wait(3000);
            
            await updateText("Final Step", "Automated Certificates", "Teachers are rewarded instantly with a Tiered Certificate based on their enrollment count.");
            await clickElement('btn-success-to-cert');
            await wait(4000);

            await updateText("End of Demo", "Koraput is Ready", "Thank you for watching. The system is live.");
        }
    </script>
</body>
</html>
