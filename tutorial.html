<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koraput NILP - Automated Tutorial</title>
    <script src="tailwind.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; margin: 0; padding: 0; overflow: hidden; }
        
        /* Forces exactly 16:9 ratio for screen recording */
        #video-container {
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            max-height: 100vh;
            max-width: 177.78vh;
            margin: auto;
            position: absolute;
            top: 0; bottom: 0; left: 0; right: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
        }
    </style>
</head>
<body>

    <div id="video-container" class="flex shadow-2xl">
        <!-- LEFT PANE: Presentation Text -->
        <div class="w-5/12 h-full flex flex-col justify-center p-16 pl-20 relative z-10 border-r border-slate-800 bg-slate-900/50">
            <div class="w-16 h-16 bg-orange-500 rounded-2xl flex items-center justify-center mb-8 shadow-lg shadow-orange-500/30">
                <i class="fa-solid fa-graduation-cap text-3xl text-white"></i>
            </div>
            <h3 id="tut-step" class="text-orange-400 font-bold tracking-widest uppercase text-sm mb-3">ସ୍ୱାଗତମ୍ (WELCOME)</h3>
            <h1 id="tut-title" class="text-5xl font-black text-white leading-tight mb-6 transition-all duration-300">କୋରାପୁଟ ଉଲ୍ଲାସ ଇନିସିଏଟିଭ</h1>
            <p id="tut-desc" class="text-xl text-slate-400 font-medium leading-relaxed transition-all duration-300"></p>
            
            <button id="start-btn" onclick="startTutorial()" class="mt-12 px-10 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-lg rounded-full w-max shadow-[0_0_20px_rgba(79,70,229,0.4)] transition-all tracking-wider">
                <i class="fa-solid fa-play mr-2"></i> PLAY
            </button>
        </div>

        <!-- RIGHT PANE: Mobile Simulator -->
        <div class="w-7/12 h-full flex items-center justify-center relative overflow-hidden">
            <div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] bg-indigo-500/10 rounded-full blur-3xl"></div>
            <div class="absolute bottom-[-10%] left-[10%] w-[500px] h-[500px] bg-emerald-500/10 rounded-full blur-3xl"></div>

            <!-- Mobile Phone Hardware Frame -->
            <div class="relative w-[400px] h-[820px] bg-slate-800 rounded-[3.5rem] shadow-[0_25px_50px_-12px_rgba(0,0,0,0.7)] border-[12px] border-slate-800 overflow-hidden ring-1 ring-slate-700 z-20">
                <div class="absolute top-0 inset-x-0 h-7 w-40 bg-slate-800 rounded-b-3xl mx-auto z-50 flex items-center justify-center gap-4">
                    <div class="w-16 h-1.5 bg-slate-700 rounded-full"></div>
                    <div class="w-3 h-3 bg-slate-900 rounded-full border border-slate-700/50"></div>
                </div>

                <!-- THE ACTUAL WEBSITE LOADED HERE -->
                <iframe id="app-frame" src="index.html" class="w-full h-full border-none bg-white rounded-[2.5rem]"></iframe>
            </div>
        </div>
    </div>

    <script>
        const frame = document.getElementById('app-frame');
        
        // Automation Helpers
        const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
        
        const updateText = async (step, title, desc) => {
            const elStep = document.getElementById('tut-step');
            const elTitle = document.getElementById('tut-title');
            const elDesc = document.getElementById('tut-desc');
            
            elTitle.style.opacity = 0; elDesc.style.opacity = 0;
            await wait(600); // Smooth fade out
            
            elStep.innerText = step;
            elTitle.innerText = title;
            elDesc.innerText = desc;
            
            elTitle.style.opacity = 1; elDesc.style.opacity = 1;
        };

        const simulateTyping = async (inputId, text, speed = 250) => {
            const doc = frame.contentWindow.document;
            const input = doc.getElementById(inputId);
            if(!input) return;
            input.focus();
            input.value = '';
            for (let i = 0; i < text.length; i++) {
                input.value += text[i];
                input.dispatchEvent(new Event('input', { bubbles: true }));
                await wait(speed); // Deliberate, human-like typing
            }
            input.blur();
        };

        const clickElement = async (id) => {
            const doc = frame.contentWindow.document;
            const el = doc.getElementById(id);
            if(el) {
                el.style.transform = "scale(0.95)";
                await wait(250);
                el.style.transform = "scale(1)";
                el.click();
            }
        };

        const smoothScrollTo = async (id) => {
            const doc = frame.contentWindow.document;
            const el = doc.getElementById(id);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            await wait(1500); // Give user ample time to see the scroll happen
        };

        // THE MASTER AUTOMATION SCRIPT
        async function startTutorial() {
            document.getElementById('start-btn').classList.add('hidden');
            
            // Smart Demo Data Generator (Prevents duplication errors forever)
            const randomPhone = "98" + Math.floor(10000000 + Math.random() * 90000000); 
            const baseScore = Math.floor(25 + Math.random() * 15);
            const upgradedScore = baseScore + 20;

            // Wait a moment before starting to let user prepare
            await wait(2500);

            // ================= PHASE 1: REGISTRATION ================= //
            await updateText("ପଦକ୍ଷେପ ୧ (Step 1)", "ଶିକ୍ଷକ ପଞ୍ଜିକରଣ", "ନୂଆ ଆବେଦନ କରିବା ପାଇଁ ଶିକ୍ଷକମାନେ 'ପଞ୍ଜିକରଣ' (Registration) ଉପରେ କ୍ଲିକ୍ କରନ୍ତୁ।");
            await wait(5000); // Time to read intro
            
            await smoothScrollTo('btn-show-form');
            await clickElement('btn-show-form');
            await wait(3500); // Wait for form to open and user to digest

            await updateText("ପଦକ୍ଷେପ ୨ (Step 2)", "ବ୍ୟକ୍ତିଗତ ବିବରଣୀ", "ନିଜର ସଠିକ୍ ନାମ, ଫୋନ୍ ନମ୍ବର ଏବଂ ଏକ ୪-ଅଙ୍କ ବିଶିଷ୍ଟ ପିନ୍ ପ୍ରବେଶ କରନ୍ତୁ। ଏହି ପିନ୍ ଆପଣଙ୍କୁ ପରେ ଦରକାର ହେବ।");
            await smoothScrollTo('teacher-name');
            await wait(1000);
            
            await simulateTyping('teacher-name', 'Rajesh Kumar', 180);
            await wait(1500);
            
            await simulateTyping('teacher-phone', randomPhone, 180);
            await wait(1500);
            
            await simulateTyping('teacher-pin', '1234', 300); // Slow pin typing
            await simulateTyping('teacher-pin-confirm', '1234', 300);
            await wait(4000); // Longer pause to let viewer see the filled personal details

            await updateText("ପଦକ୍ଷେପ ୩ (Step 3)", "ମ୍ୟାଜିକ୍ UDISE ଟେକ୍ନୋଲୋଜି", "କେବଳ ୧୧-ଅଙ୍କ ବିଶିଷ୍ଟ ସ୍କୁଲ୍ UDISE କୋଡ୍ ଟାଇପ୍ କରନ୍ତୁ, ବିଦ୍ୟାଳୟର ସମସ୍ତ ତଥ୍ୟ ସରକାରୀ ଡାଟାବେସ୍ ରୁ ଆପେ ଆପେ ଆସିଯିବ। (100% ସୁରକ୍ଷିତ)");
            await smoothScrollTo('school-udise');
            await wait(1000);
            
            await simulateTyping('school-udise', '21290100104', 350); // Very slow for dramatic effect
            await wait(5000); // Plenty of time to see the Magic Verification Box pop up!

            await updateText("ପଦକ୍ଷେପ ୪ (Step 4)", "ସ୍କୋର୍ ଦାଖଲ", "ବର୍ତ୍ତମାନ ଆପଣ ନାମାଙ୍କନ କରିଥିବା ମୋଟ ଶିକ୍ଷାର୍ଥୀଙ୍କ ସଂଖ୍ୟା ଲେଖି ଫର୍ମ୍ ଦାଖଲ କରନ୍ତୁ।");
            await smoothScrollTo('learners-enrolled');
            await wait(1000);
            
            await simulateTyping('learners-enrolled', baseScore.toString(), 300);
            await wait(2500);
            
            await clickElement('submit-btn');
            await wait(6000); // Wait for submission success page to fully load

            // WhatsApp Share Info
            await updateText("ପଦକ୍ଷେପ ୫ (Step 5)", "ହ୍ୱାଟସ୍ଆପ୍ ରେ ସେୟାର୍ କରନ୍ତୁ", "ଫର୍ମ୍ ଦାଖଲ ସଫଳ ହେବା ପରେ, ଆପଣ ସିଧାସଳଖ ନିଜର ପ୍ରମାଣପତ୍ର ହ୍ୱାଟସ୍ଆପ୍ (WhatsApp) ମାଧ୍ୟମରେ ସାଙ୍ଗମାନଙ୍କ ସହ ସେୟାର୍ କରିପାରିବେ।");
            await wait(7000); // Plenty of time to read about WhatsApp share

            // Return to Home for next feature
            const doc = frame.contentWindow.document;
            const homeBtn = doc.querySelector('#section-success .close-section');
            if(homeBtn) homeBtn.click();
            await wait(3000);


            // ================= PHASE 2: UPDATE SCORE ================= //
            await updateText("ପଦକ୍ଷେପ ୬ (Step 6)", "ସ୍କୋର୍ ଅପଡେଟ୍ (Update Score)", "ଭବିଷ୍ୟତରେ ଆପଣଙ୍କର ନାମାଙ୍କନ ସଂଖ୍ୟା ବଢିଲେ, 'ସ୍କୋର୍ ଅପଡେଟ୍' ଉପରେ କ୍ଲିକ୍ କରନ୍ତୁ। ନୂଆ କରି ଫର୍ମ୍ ପୂରଣ କରିବା ଦରକାର ନାହିଁ।");
            await wait(5000);
            
            await smoothScrollTo('btn-show-update');
            await clickElement('btn-show-update');
            await wait(3000);

            await updateText("ଲଗ୍-ଇନ୍ (Login)", "ସୁରକ୍ଷିତ ଲଗ୍-ଇନ୍", "କେବଳ ନିଜର ପଞ୍ଜୀକୃତ ଫୋନ୍ ନମ୍ବର ଏବଂ ସେହି ୪-ଅଙ୍କ ପିନ୍ ବ୍ୟବହାର କରି ଲଗ୍ ଇନ୍ କରନ୍ତୁ।");
            await simulateTyping('up-phone', randomPhone, 180);
            await simulateTyping('up-pin', '1234', 300);
            await wait(2000);
            await clickElement('btn-up-login');
            await wait(5000); // Give time for login to process and dashboard to open

            await updateText("ଅପଡେଟ୍ ସେଭ୍", "ନୂଆ ମୋଟ ସଂଖ୍ୟା (New Total)", "ଆପଣଙ୍କର ପୁରୁଣା ସ୍କୋର୍ ସେଠାରେ ଦେଖାଇବ। କେବଳ ନୂଆ ବର୍ଦ୍ଧିତ ମୋଟ ସଂଖ୍ୟା ଟାଇପ୍ କରି ସେଭ୍ କରନ୍ତୁ।");
            await simulateTyping('new-score', upgradedScore.toString(), 300);
            await wait(2500);
            await clickElement('btn-save-update');
            await wait(6000); // Read success message

            // Return to Home
            const doc2 = frame.contentWindow.document;
            const homeBtn2 = doc2.querySelector('#section-success .close-section');
            if(homeBtn2) homeBtn2.click();
            await wait(3000);


            // ================= PHASE 3: LEADERBOARD ================= //
            await updateText("ପଦକ୍ଷେପ ୭ (Step 7)", "ଲିଡରବୋର୍ଡ (Live Leaderboard)", "ଜିଲ୍ଲା ସ୍ତରରେ ଆପଣଙ୍କ ବ୍ଲକ୍ ଏବଂ ସ୍କୁଲର ପ୍ରଦର୍ଶନ ଏବଂ ରାଙ୍କ୍ (Rank) ଟ୍ରାକ୍ କରନ୍ତୁ।");
            await wait(5000);
            
            await smoothScrollTo('btn-show-leaderboard');
            await clickElement('btn-show-leaderboard');
            await wait(5000); // Let leaderboard load

            await updateText("ବ୍ଲକ୍ ରାଙ୍କିଙ୍ଗ୍", "ଲାଇଭ୍ ଡାଟା ଟ୍ରାକିଂ", "ଆପଣ କୌଣସି ବି ବ୍ଲକ୍ ଉପରେ କ୍ଲିକ୍ କରି ସେହି ବ୍ଲକର ଶ୍ରେଷ୍ଠ ୧୦୦ ଜଣ ଶିକ୍ଷକଙ୍କ ତାଲିକା ଦେଖିପାରିବେ।");
            await wait(4000);
            
            // Simulate clicking the first block in the leaderboard table
            const doc3 = frame.contentWindow.document;
            const firstBlock = doc3.querySelector('#tbody-blocks tr');
            if(firstBlock) {
                firstBlock.style.backgroundColor = "#e0e7ff";
                await wait(400);
                firstBlock.click();
            }
            await wait(6000); // Look at the school rankings longer
            
            // Go back
            const backBtn = doc3.getElementById('btn-back-blocks');
            if(backBtn) backBtn.click();
            await wait(3000);
            
            // Close Leaderboard
            const closeBtnLb = doc3.querySelector('#section-leaderboard .close-section');
            if(closeBtnLb) closeBtnLb.click();
            await wait(3000);


            // ================= PHASE 4: CERTIFICATE ================= //
            await updateText("ପଦକ୍ଷେପ ୮ (Step 8)", "ପ୍ରମାଣପତ୍ର ସେୟାର୍", "ସାର୍ଟିଫିକେଟ୍ ଟାଇଲ୍ ଉପରେ କ୍ଲିକ୍ କରି, ଆପଣ ଯେକୌଣସି ସମୟରେ ନିଜର ପ୍ରମାଣପତ୍ର ଡାଉନଲୋଡ୍ କିମ୍ବା ସେୟାର୍ କରିପାରିବେ।");
            await wait(5000);
            
            await smoothScrollTo('btn-show-certificate');
            await clickElement('btn-show-certificate');
            await wait(3000);

            await updateText("ସାର୍ଟିଫିକେଟ୍", "ଡାଉନଲୋଡ୍ କରନ୍ତୁ", "ନିଜର ନମ୍ବର ଏବଂ ପିନ୍ ଦେଇ ନିଜର ସିଲଭର, ଗୋଲ୍ଡ, କିମ୍ବା ଡାଇମଣ୍ଡ ବ୍ୟାଜ୍ ସାର୍ଟିଫିକେଟ୍ ପ୍ରାପ୍ତ କରନ୍ତୁ।");
            await simulateTyping('cert-phone', randomPhone, 180);
            await simulateTyping('cert-pin', '1234', 300);
            await wait(2000);
            
            await clickElement('btn-cert-login');
            await wait(7000); // Admire the certificate download page

            // ================= END: RETURN TO HOME ================= //
            await updateText("ସମ୍ପୂର୍ଣ୍ଣ (Complete)", "କୋରାପୁଟ ପ୍ରସ୍ତୁତ ଅଛି", "ଡେମୋ ସରିଲା | ଆଜି ହିଁ ଯୋଗଦାନ କରନ୍ତୁ ଏବଂ କୋରାପୁଟକୁ ୧୦୦% ସାକ୍ଷର କରିବାରେ ସାହାଯ୍ୟ କରନ୍ତୁ | \n\nଧନ୍ୟବାଦ (Thank You).");
            
            // Close the certificate modal and return to home page
            const doc4 = frame.contentWindow.document;
            const certCloseBtn = doc4.querySelector('#section-certificate .close-section');
            if(certCloseBtn) {
                certCloseBtn.style.transform = "scale(0.95)";
                await wait(250);
                certCloseBtn.style.transform = "scale(1)";
                certCloseBtn.click();
            }
            
            // Smoothly scroll back to the very top of the home page
            await wait(1000);
            frame.contentWindow.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
